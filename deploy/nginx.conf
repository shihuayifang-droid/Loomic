# HaHart web container (OP-07): static export from apps/web/out plus a
# same-origin reverse proxy to the server container.
#
# Installed as /etc/nginx/conf.d/default.conf, so this file is a whole
# `server { }` block (the http-level context comes from nginx's own conf).
server {
    listen 80;
    server_name _;

    # Security response headers (OP-17). nginx serves the static export itself,
    # so the Fastify hook that covers /api/* never sees these page requests;
    # they must be added here. `always` keeps them on error responses too.
    #
    # NOTE: nginx add_header has an inheritance trap: if any nested `location`
    # block declares its own add_header, the server-level ones are dropped for
    # that block. No location block in this file declares add_header, so these
    # apply everywhere (re-check this when adding add_header to a location).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    #
    # CSP rationale (do not tighten without checking the four notes below):
    # - script-src 'unsafe-inline': the Next.js static export ships inline
    #   hydration scripts / bootstrap JSON; dropping 'unsafe-inline' blanks
    #   the whole frontend.
    # - style-src 'unsafe-inline': Next injects inline styles.
    # - connect-src is only 'self' plus ws:/wss: because the frontend talks to
    #   the same-origin /api and the same-origin WebSocket (/api/ws) and
    #   nothing else -- no third-party origin is allowed. This is the network
    #   -layer backstop for OP-17 + OP-07 ("no third-party requests").
    # - img-src data:/blob: are required by the canvas and preview surfaces
    #   (and media-src blob: by media preview URLs).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (assets, tool output, zip) go through /api/uploads.
    client_max_body_size 50m;

    # Docker's embedded DNS. Re-resolve the server container on every request
    # (valid=10s) so recreating it does not leave web proxying to a dead IP (45E).
    resolver 127.0.0.11 valid=10s ipv6=off;
    # A variable target with no URI part forwards the original request URI
    # unchanged, same as the prefix-location form it replaces.
    set $hahart_api http://server:3001;

    # WebSocket: the API upgrades /api/ws (see apps/server/ws + use-websocket.ts).
    # Longer prefix than /api/, so nginx routes the upgrade here.
    location /api/ws {
        proxy_pass $hahart_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $hahart_api;
        proxy_http_version 1.1;
        # Streaming responses (agent events, job progress) must not be buffered.
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 50m;
    }

    # Object volume (HAHART_STORAGE_PROVIDER=fs) served by the API.
    # `proxy_buffering off` keeps video Range requests streaming end to end.
    location /objects/ {
        proxy_pass $hahart_api;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 50m;
    }

    # Static export SPA fallback: /canvas/xyz -> /canvas/xyz.html or index.html.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
